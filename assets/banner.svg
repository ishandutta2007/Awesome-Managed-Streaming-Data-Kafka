<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
      .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
      .badge-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
      .stream-line { stroke-dasharray: 12 8; animation: streamMove 20s linear infinite; }
      .pulse-dot { animation: pulse 2s ease-in-out infinite alternate; }
      @keyframes streamMove {
        from { stroke-dashoffset: 400; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.7; }
        100% { transform: scale(1.05); opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic/Animated Background Stream Waves (Behind text) -->
  <g opacity="0.35">
    <path d="M-50 260 Q 300 180, 600 240 T 1250 190" fill="none" stroke="url(#accent-grad)" stroke-width="4" class="stream-line"/>
    <path d="M-50 290 Q 300 210, 600 270 T 1250 220" fill="none" stroke="#06b6d4" stroke-width="2" class="stream-line" style="animation-duration: 15s;"/>
    <path d="M-50 220 Q 300 140, 600 200 T 1250 150" fill="none" stroke="#8b5cf6" stroke-width="3" class="stream-line" style="animation-duration: 25s;"/>
    
    <!-- Data Nodes / Floating Particles -->
    <circle cx="250" cy="225" r="6" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="550" cy="250" r="8" fill="#8b5cf6" filter="url(#glow)"/>
    <circle cx="850" cy="205" r="5" fill="#06b6d4" filter="url(#glow)"/>
    <circle cx="1050" cy="235" r="7" fill="#3b82f6" filter="url(#glow)"/>
  </g>

  <!-- Geometric Grid Accent -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/>
    <line x1="700" y1="0" x2="700" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
    <line x1="1100" y1="0" x2="1100" y2="320"/>
  </g>

  <!-- Content Container (Foreground - Ensures visibility over dynamic elements) -->
  <g transform="translate(60, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="250" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="18" cy="16" r="5" fill="#10b981" class="pulse-dot"/>
      <text x="32" y="21" class="badge-text">MANAGED STREAMING &amp; KAFKA</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" class="title">Awesome Managed Streaming Data (Kafka)</text>

    <!-- Subtitle -->
    <text x="0" y="178" class="subtitle">Curated SaaS Platforms, Event Streaming Engines &amp; Open-Source Data Infrastructure</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 215)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
      <text x="65" y="18" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">☁️ Cloud SaaS</text>

      <!-- Tag 2 -->
      <rect x="142" y="0" width="150" height="28" rx="6" fill="#0f172a" stroke="#7c3aed" stroke-width="1"/>
      <text x="217" y="18" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Stream Processing</text>

      <!-- Tag 3 -->
      <rect x="304" y="0" width="150" height="28" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
      <text x="379" y="18" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">🚀 Open Source</text>
    </g>
  </g>
</svg>
